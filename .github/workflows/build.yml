# Сборка на каждый push: проверяет, что всё компилируется, и собирает установщик.
# Тег вида v1.2.3 — дополнительно публикует установщик в GitHub Releases.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: UI type check and tests
        working-directory: src/ui
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SysWatch-Setup
          path: installer/Output/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
